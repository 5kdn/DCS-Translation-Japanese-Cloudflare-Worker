name: 📝 ドキュメント改善
description: README / OpenAPI / 運用ガイドなどの改善提案や不備報告
title: "[Docs]: "
labels: [documentation]
body:
  - type: input
    id: summary
    attributes:
      label: 概要
      description: 改善したい内容を 1 行でまとめてください
      placeholder: "例: Cloudflare Worker へのデプロイ手順が不足している"
    validations:
      required: true

  - type: dropdown
    id: doc_type
    attributes:
      label: 対象ドキュメント種別
      description: 該当するものを選択してください
      options:
        - README / プロジェクト概要
        - OpenAPI / Swagger UI
        - CONTRIBUTING / 開発ガイド
        - CI/CD / 運用手順
        - その他
    validations:
      required: true

  - type: input
    id: doc_path
    attributes:
      label: 対象ファイル / URL
      description: 修正したいファイルパスやセクション URL を記載してください
      placeholder: "例: README.md > 実行と開発手順 / https://{worker}/docs"
    validations:
      required: true

  - type: textarea
    id: current
    attributes:
      label: 現状の記述 / 誤り
      description: 問題となる現状の抜粋や状況を記載してください
      placeholder: |
        例:
        - 対応 Node.js バージョンが 16 と記載されている
        - `/download-zip` のレスポンス例が古い
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 提案する修正内容
      description: 望ましい記述、追記したい情報、図版などを具体的に書いてください
      placeholder: |
        例:
        - Node.js >= 20 を前提とする
        - 実際の curl コマンド例を追加する
    validations:
      required: true

  - type: textarea
    id: proof
    attributes:
      label: 根拠・参照URL
      description: 修正内容を裏付けるリンクや資料があれば記載してください
      placeholder: "例: Cloudflare Docs / GitHub API リファレンス / 内部メモ"
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: 補足
      description: 期待する読者、反映希望時期など補足事項があれば記載してください
      placeholder: "例: 初学者向けに段階的な手順を追加したい"
    validations:
      required: false
