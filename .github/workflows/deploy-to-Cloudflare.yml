# ------------------------------------------------------------
# Workflow Name : Deploy to Cloudflare
# Trigger       : release type publish
# Purpose       :
#   - Cloudflare workers にデプロイする
# ------------------------------------------------------------
name: Deploy to Cloudflare

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  NODE_VERSION: "24.x"
  PNPM_VERSION: "10.33.0"

jobs:
  Deploy:
    name: Deploy
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    concurrency:
      group: cloudflare-deploy-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - run: pnpm i --frozen-lockfile

      - name: Deploy with cf
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TARGET_GH_SECRET: ${{ secrets.TARGET_GH_SECRET }}
        run: |
          secrets_file="$RUNNER_TEMP/cloudflare-secrets.json"
          trap 'rm -f "$secrets_file"' EXIT
          node -e "require('node:fs').writeFileSync(process.env.RUNNER_TEMP + '/cloudflare-secrets.json', JSON.stringify({ TARGET_GH_SECRET: process.env.TARGET_GH_SECRET }), { mode: 0o600 })"
          pnpm run deploy --secrets-file "$secrets_file"
